apply plugin: 'io.spring.convention.spring-module'

dependencies {
	compile project(':spring-security-core')
	compile 'org.springframework:spring-aop'
	compile 'org.springframework:spring-context'
	compile 'org.springframework:spring-core'
	compile 'org.springframework:spring-jdbc'
	compile 'org.springframework:spring-tx'
	compile 'io.projectreactor:reactor-bom:Bismuth-SR17'
	compile 'org.springframework:spring-framework-bom:5.0.19.RELEASE'
	compile 'org.springframework.data:spring-data-releasetrain:Kay-SR14'

	optional 'net.sf.ehcache:ehcache'

	testCompile 'org.springframework:spring-beans'
	testCompile 'org.springframework:spring-context-support'
	testCompile 'org.springframework:spring-test'

	testRuntime 'org.hsqldb:hsqldb'
}
repositories{
	mavenCentral()
	gradlePluginPortal()
	jcenter()
	maven { url 'https://repo.spring.io/plugins-snapshot' }
	maven {
		name = "jfreleases"
		url = "https://releases.jfrog.io/artifactory/oss-releases/"
	}
}
