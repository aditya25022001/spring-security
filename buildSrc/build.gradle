apply plugin: 'groovy'

repositories {
	mavenCentral()
	gradlePluginPortal()
	jcenter()
	maven { url 'https://repo.spring.io/plugins-snapshot' }
	maven {
		name = "jfreleases"
		url = "https://releases.jfrog.io/artifactory/oss-releases/"
	}
}

dependencies {
	compile gradleApi()
}

// GAE
dependencies {
	compile 'com.google.appengine:appengine-tools-sdk:1.4.2'
}

dependencies{
	compile "emma:emma:2.0.5312"
}

// Trang
dependencies {
	compile 'com.thaiopensource:trang:20091111',
			'net.sourceforge.saxon:saxon:9.1.0.8'
}

task ide(type: Copy)  {
	from configurations.runtime
	into 'ide'
}
